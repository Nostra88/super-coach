<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050807">
<title>SUPERCOACH</title>
<style>
:root{--bg:#050807;--s1:#0E1C16;--s2:#13241C;--gold:#E0C36A;--g:#14F195;--red:#FF4D6D;--t:#FBFAF4;--t3:#8FA196}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;padding-bottom:88px}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(5,8,7,.94);border-bottom:1px solid rgba(224,195,106,.18)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em}
.bolt{width:12px;height:20px;background:var(--gold);clip-path:polygon(65% 0,32% 48%,58% 48%,35% 100%,78% 48%,50% 48%)}
.brand b{color:var(--g)}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px}
.h{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:700;margin:18px 0 8px}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px}
.card{background:var(--s1);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:12px;margin-bottom:8px}
.card.live{border-color:rgba(255,77,109,.35)}
.teams{font-weight:700}
.meta{font-size:12px;color:var(--t3);margin-top:4px}
.empty{color:var(--t3);font-size:13px;padding:16px;text-align:center}
.ucl{width:100%;margin:10px 0;display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid rgba(224,195,106,.3);color:var(--t);border-radius:12px;padding:11px 14px;font-weight:800;letter-spacing:.12em}
.ucl span{color:var(--gold);border:1px solid rgba(224,195,106,.4);border-radius:4px;padding:2px 6px;font-size:10px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--s2);border:1px solid rgba(255,255,255,.06);color:var(--t3);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700}
.chip.on{color:var(--g);border-color:rgba(20,241,149,.4)}
.item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid rgba(255,255,255,.06);border-radius:12px;margin-bottom:8px;background:var(--s1)}
.item.on{border-color:var(--g)}
.ck{width:18px;height:18px;border:1px solid var(--t3);border-radius:4px;text-align:center;color:var(--g)}
.btn{width:100%;margin-top:8px;padding:14px;border:0;border-radius:12px;background:#00B86B;color:#fff;font-weight:800;letter-spacing:.08em}
.btn:disabled{opacity:.4}
.out{margin-top:14px;white-space:pre-wrap;font-size:13px;line-height:1.45}
</style>
</head>
<body>
<header class="hdr"><div class="brand"><i class="bolt"></i>SUPER<b>COACH</b></div></header>
<div class="wrap">
  <div class="h"><i class="live-dot"></i>EN DIRECT</div>
  <div id="liveBox" class="empty">Chargement…</div>
  <div class="h">CE SOIR</div>
  <div id="tonightBox" class="empty">Chargement…</div>
  <div class="h">MATCHS</div>
  <button class="ucl" type="button" onclick="openUcl()"><span>UCL</span> CHAMPIONS LEAGUE</button>
  <div id="uclPanel" hidden>
    <div class="filters">
      <button class="chip on" data-u="all" type="button" onclick="setUcl('all')">TOUS LES MATCHS</button>
      <button class="chip" data-u="live" type="button" onclick="setUcl('live')">LIVE</button>
      <button class="chip" data-u="today" type="button" onclick="setUcl('today')">AUJOURD'HUI</button>
      <button class="chip" data-u="next" type="button" onclick="setUcl('next')">PROCHAINS</button>
    </div>
    <div id="uclList"></div>
  </div>
  <div class="filters" id="sports"></div>
  <div id="list"></div>
  <button class="btn" id="go" disabled type="button" onclick="analyze()">ANALYZE SELECTION</button>
  <div class="out" id="out"></div>
</div>
<script>
var BACKEND="https://supercoach-api-acyw.onrender.com";
var pool=[], selected=[], sport="all", uclF="all";
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&","<":"<",">":">","\"":"""}[c];});}
function isLive(m){
  var st=String(m.statusShort||m.status||"");
  return !!(m.isLive||m.live||/^(live|1h|2h|ht|et|p1|p2|p3|in)$/i.test(st)||/\blive\b/i.test(st));
}
function isUcl(m){
  var sid=String(m.sport||m.sportId||"");
  if(sid && !/foot|soccer/.test(sid)) return false;
  if(m.leagueId===2||m.leagueId==="2") return true;
  var c=String(m.competition||"").toLowerCase();
  if(/championship|concacaf|hockey/.test(c)) return false;
  return /uefa champions league/.test(c)||/champions league/.test(c);
}
function noisy(m){
  return /u1[6-9]|u20|u21|academy|reserve|club friendly|amical/i.test((m.competition||"")+" "+(m.home||"")+" "+(m.away||""));
}
function when(m){
  if(m.time) return m.time;
  if(!m.dateUTC) return "";
  var d=new Date(m.dateUTC);
  return isNaN(d.getTime())?"":d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function key(m){return String(m.id||((m.sport||"")+"|"+m.home+"|"+m.away));}
function load(){
  fetch(BACKEND+"/fixtures").then(function(r){return r.json();}).then(function(d){
    pool=(d.matches||[]).filter(function(m){return m.home&&m.away&&!m.isFinished&&!noisy(m);});
    pool.forEach(function(m){m.isLive=isLive(m);});
    draw();
  }).catch(function(){
    document.getElementById("liveBox").textContent="Impossible de charger les matchs.";
    document.getElementById("tonightBox").textContent="";
  });
}
function draw(){
  var live=pool.filter(function(m){return m.isLive;});
  var now=new Date();
  var tonight=pool.filter(function(m){
    if(m.isLive||!m.dateUTC) return false;
    var h=(new Date(m.dateUTC)-now)/3600000;
    return h>=-0.2 && h<=24;
  }).slice(0,8);
  document.getElementById("liveBox").innerHTML=live.length?live.slice(0,6).map(card).join(""):'<div class="empty">Aucun match en direct pour le moment.</div>';
  document.getElementById("tonightBox").innerHTML=tonight.length?tonight.map(card).join(""):'<div class="empty">Aucune rencontre ce soir.</div>';
  var ids={all:1};
  pool.forEach(function(m){ids[m.sport||m.sportId||"other"]=1;});
  document.getElementById("sports").innerHTML=Object.keys(ids).map(function(id){
    return '<button class="chip'+(sport===id?" on":"")+'" type="button" onclick="setSport(\''+id+'\')">'+esc(id.toUpperCase())+"</button>";
  }).join("");
  var rows=pool.filter(function(m){return sport==="all"||(m.sport||m.sportId)===sport;}).slice(0,80);
  document.getElementById("list").innerHTML=rows.length?rows.map(row).join(""):'<div class="empty">Aucun match.</div>';
  document.getElementById("go").disabled=!selected.length;
  document.getElementById("go").textContent=selected.length?("ANALYZE SELECTION ["+selected.length+"]"):"ANALYZE SELECTION";
  renderUcl();
}
function setSport(id){sport=id;draw();}
function card(m){
  return '<div class="card'+(m.isLive?" live":"")+'"><div class="teams">'+esc(m.home)+" — "+esc(m.away)+'</div><div class="meta">'+(m.isLive?"LIVE · ":"")+esc(m.competition||"")+" · "+esc(when(m))+(m.score?" · "+esc(m.score):"")+"</div></div>";
}
function row(m){
  var id=key(m), on=selected.indexOf(id)>-1;
  return '<div class="item'+(on?" on":"")+'" onclick="toggle(this.getAttribute(\'data-id\'))" data-id="'+esc(id)+'"><div class="ck">'+(on?"\u2713":"")+'</div><div><div class="teams">'+esc(m.home)+" — "+esc(m.away)+'</div><div class="meta">'+esc(m.competition||"")+" · "+esc(when(m))+"</div></div></div>";
}
function toggle(id){
  var i=selected.indexOf(id);
  if(i>-1) selected.splice(i,1); else selected.push(id);
  draw();
}
function openUcl(){
  var p=document.getElementById("uclPanel");
  p.hidden=!p.hidden;
  renderUcl();
}
function setUcl(f){uclF=f;renderUcl();}
function renderUcl(){
  var box=document.getElementById("uclList");
  if(!box) return;
  document.querySelectorAll("[data-u]").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-u")===uclF);});
  var now=new Date();
  var rows=pool.filter(isUcl).filter(function(m){
    if(uclF==="all") return true;
    if(uclF==="live") return m.isLive;
    var d=m.dateUTC?new Date(m.dateUTC):null;
    if(uclF==="today") return d&&d.toDateString()===now.toDateString();
    return d&&d>now&&d.toDateString()!==now.toDateString();
  });
  box.innerHTML=rows.length?rows.map(row).join(""):'<div class="empty">Aucune rencontre de Ligue des champions disponible actuellement.</div>';
}
function analyze(){
  var picks=pool.filter(function(m){return selected.indexOf(key(m))>-1;});
  if(!picks.length) return;
  var text=picks.map(function(m){return m.home+" vs "+m.away+" — "+(m.competition||"")+" — "+when(m);}).join("\n");
  document.getElementById("out").textContent="Analyse en cours\u2026";
  fetch(BACKEND+"/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text})})
    .then(function(r){return r.json();})
    .then(function(d){
      var raw=d.result||d;
      document.getElementById("out").textContent=typeof raw==="string"?raw.slice(0,4000):JSON.stringify(raw,null,2).slice(0,4000);
    })
    .catch(function(e){document.getElementById("out").textContent=String(e.message||e);});
}
load();
</script>
</body>
</html>
