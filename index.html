<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SUPERCOACH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg: #0d1117; --s1: #161b22; --s2: #1c2128; --s3: #21262d;
  --b1: #30363d; --b2: #3d444d; --green: #1B5E35; --green3: #4ade80;
  --gold: #C8922A; --gold2: #d4af88; --text: #e6edf3; --text2: #8b949e; --text3: #6e7681;
}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}

.hdr{position:sticky;top:0;z-index:200;background:rgba(13,17,23,.92);backdrop-filter:blur(24px);border-bottom:1px solid rgba(200,146,42,.12);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.hdr-logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;position:relative;display:flex;align-items:center;justify-content:center}
.logo-bolt{width:20px;height:28px;background:linear-gradient(160deg,#fde68a 0%,var(--gold) 50%,#8B6914 100%);clip-path:polygon(65% 0%,35% 45%,60% 45%,35% 100%,75% 50%,48% 50%)}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;background:linear-gradient(135deg,#f0ede4,#d4af88); -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.live-pill{display:flex;align-items:center;gap:4px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);padding:3px 9px;border-radius:20px;font-size:10px;color:#ef4444;font-weight:700}
.live-dot{width:5px;height:5px;background:#ef4444;border-radius:50%;animation:blink 1s infinite}
.roi-btn{padding:5px 12px;background:rgba(200,146,42,.1);border:1px solid rgba(200,146,42,.2);border-radius:20px;color:var(--gold);font-size:11px;cursor:pointer}

.main{max-width:820px;margin:0 auto;padding:20px 14px 100px}
.hero{text-align:center;padding:28px 12px 24px}
.hero-emblem{width:80px;height:80px;margin:0 auto 16px;position:relative}
.emblem-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;background:linear-gradient(135deg,var(--gold),var(--green),var(--gold)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);mask-composite:exclude;animation:spin 8s linear infinite}
.emblem-inner{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--s2),var(--s3));display:flex;align-items:center;justify-content:center}
.emblem-bolt{width:26px;height:36px;background:linear-gradient(160deg,#fde68a,var(--gold));clip-path:polygon(65% 0%,32% 48%,58% 48%,35% 100%,78% 48%,50% 48%)}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,9vw,64px);letter-spacing:6px;line-height:.92}
.h1-super{background:linear-gradient(135deg,#f0ede4,var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.h1-coach{background:linear-gradient(135deg,var(--green3),#2d8a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.section-card{background:var(--s1);border:1px solid var(--b1);border-radius:14px;overflow:hidden;margin-bottom:12px}
.section-hdr{background:rgba(22,27,34,.8);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.section-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;font-weight:700}
.section-body{padding:14px}

.sf-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;display:block;font-weight:600}
.sport-grid{display:flex;flex-wrap:wrap;gap:8px}
.sport-chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--b1);border-radius:12px;cursor:pointer;transition:all .2s;background:var(--s2)}
.sport-chip.active{border-color:var(--gold);background:rgba(200,146,42,.15);box-shadow:0 0 12px rgba(200,146,42,.3)}
.sc-ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.sc-label{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600}

.tabs{display:flex;gap:4px;margin:15px 0}
.tab{flex:1;padding:10px;background:var(--s2);border:1px solid var(--b1);border-radius:10px;text-align:center;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.tab.on{background:rgba(200,146,42,.2);border-color:var(--gold);color:var(--gold)}

.panel{display:none}.panel.on{display:block}
textarea,input{width:100%;background:var(--s3);border:1px solid var(--b1);border-radius:10px;color:var(--text);padding:12px;min-height:140px;font-size:14px}
.analyze-btn{width:100%;margin-top:15px;padding:16px;background:linear-gradient(135deg,var(--green),#2d8a55);border:none;border-radius:12px;color:white;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:4px;cursor:pointer}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,17,23,.96);backdrop-filter:blur(24px);border-top:1px solid rgba(200,146,42,.1);padding:8px 0;display:flex}
.nav-btn{flex:1;text-align:center;cursor:pointer}
.nav-icon{font-size:24px}
.nav-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3)}
.nav-btn.on .nav-label{color:var(--gold)}

.lang-selector{position:relative}
.lang-panel{position:absolute;top:100%;right:0;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:8px;display:none;z-index:300}
.lang-option{padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.lang-option:hover{background:var(--s3)}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-logo">
    <div class="logo-icon">
      <div class="logo-bolt"></div>
    </div>
    <div class="logo-text">SUPER<span>COACH</span></div>
  </div>
  <div class="hdr-right">
    <div class="live-pill"><div class="live-dot"></div>LIVE</div>
    <div class="lang-selector" onclick="event.stopPropagation()">
      <button class="lang-btn" id="langSelector" onclick="toggleLangPanel()">🇫🇷 FR</button>
      <div class="lang-panel" id="langPanel">
        <div class="lang-option" onclick="setLang('fr')">🇫🇷 Français</div>
        <div class="lang-option" onclick="setLang('en')">🇺🇸 English</div>
      </div>
    </div>
    <button class="roi-btn" onclick="openROI()">📊 ROI</button>
  </div>
</div>

<div class="main">

  <div class="hero">
    <div class="hero-emblem">
      <div class="emblem-ring"></div>
      <div class="emblem-inner"><div class="emblem-bolt"></div></div>
    </div>
    <h1><span class="h1-super">SUPER</span><span class="h1-coach">COACH</span></h1>
    <p class="hero-sub">⚡ Ton copilote IA sportif</p>
  </div>

  <!-- MATCHES SECTION -->
  <div class="section-card">
    <div class="section-hdr">
      <span class="section-label">⚡ MATCHS À ANALYSER</span>
    </div>
    <div class="section-body">

      <span class="sf-label">FILTRE SPORT</span>
      <div class="sport-grid" id="sportGrid"></div>

      <div class="tabs">
        <div class="tab on" id="tab-manual" onclick="switchTab('manual')">📋 LISTE</div>
        <div class="tab" id="tab-paste" onclick="switchTab('paste')">🌐 PAGE WEB</div>
      </div>

      <!-- LISTE -->
      <div class="panel on" id="panel-manual">
        <textarea id="manualInput" placeholder="Exemple :
⚽ PSG vs Monaco — Ligue 1 — 20:45 — Cote 1.75
⚽ Real Madrid vs Barcelona — La Liga
🏀 Lakers vs Celtics — NBA"></textarea>
      </div>

      <!-- PAGE WEB -->
      <div class="panel" id="panel-paste">
        <textarea id="pasteInput" placeholder="Colle ici le contenu de la page ParionsSport / Pronosoft..."></textarea>
        <button class="analyze-btn" onclick="pasteClip()" style="margin-top:10px;background:rgba(74,222,128,.2);color:#4ade80">📋 COLLER DU PRESSE-PAPIERS</button>
      </div>

      <button class="analyze-btn" onclick="analyze()">⚡ ANALYSER LES MATCHS</button>
    </div>
  </div>

  <div id="output"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-btn on" onclick="navTo('analyze')"><div class="nav-icon">⚡</div><div class="nav-label">Analyser</div></div>
  <div class="nav-btn" onclick="openROI()"><div class="nav-icon">📊</div><div class="nav-label">ROI</div></div>
  <div class="nav-btn" onclick="showSettings()"><div class="nav-icon">⚙️</div><div class="nav-label">Réglages</div></div>
</div>

<script>
// ====================== VARIABLES ======================
let activeSports = ['all'];
let activeTab = 'manual';

// ====================== SPORTS ======================
const SPORTS = [
  {id:'all', e:'🌍', l:'Tous'},
  {id:'foot', e:'⚽', l:'Football'},
  {id:'basket', e:'🏀', l:'Basket'},
  {id:'tennis', e:'🎾', l:'Tennis'},
  {id:'rugby', e:'🏉', l:'Rugby'},
  {id:'mma', e:'🥋', l:'MMA'},
  {id:'boxing', e:'🥊', l:'Boxe'},
  {id:'hockey', e:'🏒', l:'Hockey'},
  {id:'handball', e:'🤾', l:'Hand'},
  {id:'volley', e:'🏐', l:'Volley'},
  {id:'f1', e:'🏎️', l:'F1/Moto'},
  {id:'baseball', e:'⚾', l:'Baseball'}
];

// ====================== SPORT GRID ======================
function buildSportGrid() {
  let html = '';
  SPORTS.forEach(s => {
    const isActive = activeSports.includes(s.id);
    html += `
      <div class="sport-chip ${isActive ? 'active' : ''}" onclick="toggleSport('${s.id}')">
        <div class="sc-ico">${s.e}</div>
        <span class="sc-label">${s.l}</span>
      </div>`;
  });
  document.getElementById('sportGrid').innerHTML = html;
}

function toggleSport(id) {
  if (id === 'all') {
    activeSports = ['all'];
  } else {
    if (activeSports.includes('all')) activeSports = [];
    if (activeSports.includes(id)) {
      activeSports = activeSports.filter(x => x !== id);
    } else {
      activeSports.push(id);
    }
    if (activeSports.length === 0) activeSports = ['all'];
  }
  buildSportGrid();
}

// ====================== TABS ======================
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id === `tab-${tab}`));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === `panel-${tab}`));
}

// ====================== NAVIGATION ======================
function navTo(page) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('.nav-btn')[['analyze','roi','settings'].indexOf(page)].classList.add('on');
}

function openROI() {
  alert("📊 Mode ROI activé\n\nHistorique des analyses sera affiché ici (à développer).");
}

function showSettings() {
  alert("⚙️ Réglages\n\nLangue, Backend, etc. (à développer).");
}

// ====================== LANGUE ======================
function toggleLangPanel() {
  const panel = document.getElementById('langPanel');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}

function setLang(lang) {
  document.getElementById('langSelector').textContent = lang === 'fr' ? '🇫🇷 FR' : '🇺🇸 EN';
  toggleLangPanel();
  alert(`Langue changée en ${lang.toUpperCase()}`);
}

// ====================== ANALYSE (placeholder) ======================
function analyze() {
  const input = document.getElementById(activeTab === 'manual' ? 'manualInput' : 'pasteInput').value.trim();
  if (!input) {
    alert("❌ Colle des matchs à analyser !");
    return;
  }
  document.getElementById('output').innerHTML = `<div style="padding:20px;text-align:center;color:var(--gold)">⚡ Analyse en cours avec SUPERCOACH...</div>`;
  setTimeout(() => {
    document.getElementById('output').innerHTML = `<div style="padding:20px;background:var(--s1);border-radius:12px;margin-top:15px">✅ Analyse terminée !<br><br>Les résultats apparaîtront ici.</div>`;
  }, 1200);
}

function pasteClip() {
  if (navigator.clipboard) {
    navigator.clipboard.readText().then(text => {
      document.getElementById('pasteInput').value = text;
      alert("✅ Contenu collé !");
    });
  } else alert("❌ Fonction non supportée sur ce navigateur");
}

// ====================== INIT ======================
window.onload = () => {
  buildSportGrid();
  switchTab('manual');
};
</script>
</body>
</html>
