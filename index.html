<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050807">
<title>SUPERCOACH</title>
<style>
:root{--bg:#050807;--s1:#0E1C16;--s2:#13241C;--gold:#E0C36A;--g:#14F195;--red:#FF4D6D;--t:#FBFAF4;--t3:#8FA196}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;padding-bottom:24px}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(5,8,7,.94);border-bottom:1px solid rgba(224,195,106,.18)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em}
.bolt{width:12px;height:20px;background:var(--gold);clip-path:polygon(65% 0,32% 48%,58% 48%,35% 100%,78% 48%,50% 48%)}
.brand b{color:var(--g)}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px}
.h{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:700;margin:18px 0 8px}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px}
.card,.item{background:var(--s1);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:12px;margin-bottom:8px}
.card.live{border-color:rgba(255,77,109,.35)}
.item{display:flex;gap:10px;align-items:center}
.item.on{border-color:var(--g)}
.teams{font-weight:700}
.meta{font-size:12px;color:var(--t3);margin-top:4px}
.empty{color:var(--t3);font-size:13px;padding:16px;text-align:center}
.ucl{width:100%;margin:10px 0;display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid rgba(224,195,106,.3);color:var(--t);border-radius:12px;padding:11px 14px;font-weight:800;letter-spacing:.12em}
.ucl i{color:var(--gold);border:1px solid rgba(224,195,106,.4);border-radius:4px;padding:2px 6px;font-size:10px;font-style:normal}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--s2);border:1px solid rgba(255,255,255,.06);color:var(--t3);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700}
.chip.on{color:var(--g);border-color:rgba(20,241,149,.4)}
.btn{width:100%;margin-top:8px;padding:14px;border:0;border-radius:12px;background:#00B86B;color:#fff;font-weight:800;letter-spacing:.08em}
.btn:disabled{opacity:.4}
.out{margin-top:14px;white-space:pre-wrap;font-size:13px;line-height:1.45}
.ck{width:18px;height:18px;border:1px solid var(--t3);border-radius:4px;text-align:center;color:var(--g)}
</style>
</head>
<body>
<header class="hdr"><div class="brand"><i class="bolt"></i>SUPER<b>COACH</b></div></header>
<div class="wrap">
  <div class="h"><i class="live-dot"></i>EN DIRECT</div>
  <div id="liveBox" class="empty">Chargement...</div>
  <div class="h">CE SOIR</div>
  <div id="tonightBox" class="empty">Chargement...</div>
  <div class="h">MATCHS</div>
  <button class="ucl" type="button" id="uclBtn"><i>UCL</i> CHAMPIONS LEAGUE</button>
  <div id="uclPanel" hidden>
    <div class="filters" id="uclFilters">
      <button class="chip on" type="button" data-u="all">TOUS LES MATCHS</button>
      <button class="chip" type="button" data-u="live">LIVE</button>
      <button class="chip" type="button" data-u="today">AUJOURD HUI</button>
      <button class="chip" type="button" data-u="next">PROCHAINS</button>
    </div>
    <div id="uclList"></div>
  </div>
  <div class="filters" id="sports"></div>
  <div id="list"></div>
  <button class="btn" id="go" disabled type="button">ANALYZE SELECTION</button>
  <div class="out" id="out"></div>
</div>
<script>
var BACKEND = "https://supercoach-api-acyw.onrender.com";
var pool = [];
var selected = [];
var sport = "all";
var uclF = "all";
function isLive(m) {
  var st = String(m.statusShort || m.status || "");
  return !!(m.isLive || m.live || /^(live|1h|2h|ht|et|p1|p2|p3|in)$/i.test(st));
}
function isUcl(m) {
  var sid = String(m.sport || m.sportId || "");
  if (sid && sid.indexOf("foot") < 0 && sid.indexOf("soccer") < 0) return false;
  if (m.leagueId === 2 || m.leagueId === "2") return true;
  var c = String(m.competition || "").toLowerCase();
  if (c.indexOf("championship") >= 0) return false;
  return c.indexOf("champions league") >= 0;
}
function noisy(m) {
  var s = (m.competition || "") + " " + (m.home || "") + " " + (m.away || "");
  return /u1[6-9]|u20|u21|academy|reserve|club friendly|amical|\\bii\\b|\\biii\\b|whl|ohl|ushl|mhl|tobol 2|widzew ii/i.test(s);
}
var HOME_PRIORITY_RE = /world cup|coupe du monde|champions league|europa league|premier league|la liga|ligue 1|serie a|bundesliga|nba|mlb|nhl|atp|wta|us open|wimbledon/i;
function computeMatchScore(m) {
  var score = 0;
  if (m.isLive) score += 1000;
  if (HOME_PRIORITY_RE.test(m.competition || "")) score += 400;
  if (isUcl(m)) score += 350;
  if (m.dateUTC) {
    var hoursUntil = (new Date(m.dateUTC).getTime() - Date.now()) / 3600000;
    if (hoursUntil >= -3 && hoursUntil <= 48) score += Math.max(0, 100 - Math.abs(hoursUntil));
  }
  var label = ((m.competition || "") + " " + (m.home || "") + " " + (m.away || "")).toLowerCase();
  if (/npl|iii liga|1\\. division|v\\.league|south australia|thai league|national soccer|whl|junior/.test(label)) score -= 250;
  if (/double|doubles/.test(label) || ((m.home || "").indexOf("/") >= 0)) score -= 280;
  return score;
}
function byScore(a, b) { return computeMatchScore(b) - computeMatchScore(a); }
function when(m) {
  if (m.time) return m.time;
  if (!m.dateUTC) return "";
  var d = new Date(m.dateUTC);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleTimeString(undefined, {hour:"2-digit", minute:"2-digit"});
}
function key(m) { return String(m.id || ((m.sport || "") + "|" + m.home + "|" + m.away)); }
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function fillBox(id, matches, emptyText) {
  var box = document.getElementById(id);
  box.innerHTML = "";
  if (!matches.length) { box.textContent = emptyText; box.className = "empty"; return; }
  box.className = "";
  matches.forEach(function(m) {
    var c = el("div", "card" + (m.isLive ? " live" : ""));
    c.appendChild(el("div", "teams", m.home + " - " + m.away));
    c.appendChild(el("div", "meta", (m.isLive ? "LIVE \u00b7 " : "") + (m.competition || "") + " \u00b7 " + when(m)));
    box.appendChild(c);
  });
}
function renderRows(targetId, matches) {
  var box = document.getElementById(targetId);
  box.innerHTML = "";
  if (!matches.length) { box.textContent = "Aucun match."; box.className = "empty"; return; }
  box.className = "";
  matches.forEach(function(m) {
    var id = key(m);
    var on = selected.indexOf(id) > -1;
    var row = el("div", "item" + (on ? " on" : ""));
    row.appendChild(el("div", "ck", on ? "OK" : ""));
    var body = el("div");
    body.appendChild(el("div", "teams", m.home + " - " + m.away));
    body.appendChild(el("div", "meta", (m.competition || "") + " \u00b7 " + when(m)));
    row.appendChild(body);
    row.addEventListener("click", function() {
      var i = selected.indexOf(id);
      if (i > -1) selected.splice(i, 1); else selected.push(id);
      draw();
    });
    box.appendChild(row);
  });
}
function draw() {
  var live = pool.filter(function(m) { return m.isLive; }).sort(byScore);
  var now = new Date();
  var tonight = pool.filter(function(m) {
    if (m.isLive || !m.dateUTC) return false;
    var h = (new Date(m.dateUTC) - now) / 3600000;
    return h >= -0.2 && h <= 24;
  }).sort(byScore).slice(0, 8);
  fillBox("liveBox", live.slice(0, 6), "Aucun match en direct pour le moment.");
  fillBox("tonightBox", tonight, "Aucune rencontre ce soir.");
  var sports = document.getElementById("sports");
  sports.innerHTML = "";
  var ids = {all: 1};
  pool.forEach(function(m) { ids[m.sport || m.sportId || "other"] = 1; });
  Object.keys(ids).forEach(function(id) {
    var b = el("button", "chip" + (sport === id ? " on" : ""), id.toUpperCase());
    b.type = "button";
    b.addEventListener("click", function() { sport = id; draw(); });
    sports.appendChild(b);
  });
  var rows = pool.filter(function(m) { return sport === "all" || (m.sport || m.sportId) === sport; }).sort(byScore).slice(0, 80);
  renderRows("list", rows);
  var go = document.getElementById("go");
  go.disabled = !selected.length;
  go.textContent = selected.length ? ("ANALYZE SELECTION [" + selected.length + "]") : "ANALYZE SELECTION";
  renderUcl();
}
function renderUcl() {
  var now = new Date();
  var rows = pool.filter(isUcl).filter(function(m) {
    if (uclF === "all") return true;
    if (uclF === "live") return m.isLive;
    var d = m.dateUTC ? new Date(m.dateUTC) : null;
    if (uclF === "today") return d && d.toDateString() === now.toDateString();
    return d && d > now && d.toDateString() !== now.toDateString();
  });
  renderRows("uclList", rows);
}
function load() {
  fetch(BACKEND + "/fixtures").then(function(r) { return r.json(); }).then(function(d) {
    pool = (d.matches || []).filter(function(m) { return m.home && m.away && !m.isFinished && !noisy(m); });
    pool.forEach(function(m) { m.isLive = isLive(m); });
    draw();
  }).catch(function() {
    document.getElementById("liveBox").textContent = "Impossible de charger les matchs.";
    document.getElementById("tonightBox").textContent = "";
  });
}
document.getElementById("uclBtn").addEventListener("click", function() {
  var p = document.getElementById("uclPanel");
  p.hidden = !p.hidden;
  renderUcl();
});
document.getElementById("uclFilters").addEventListener("click", function(e) {
  var b = e.target.closest("[data-u]");
  if (!b) return;
  uclF = b.getAttribute("data-u");
  document.querySelectorAll("#uclFilters .chip").forEach(function(x) { x.classList.toggle("on", x === b); });
  renderUcl();
});
document.getElementById("go").addEventListener("click", function() {
  var picks = pool.filter(function(m) { return selected.indexOf(key(m)) > -1; });
  if (!picks.length) return;
  var text = picks.map(function(m) { return m.home + " vs " + m.away + " - " + (m.competition || "") + " - " + when(m); }).join("\n");
  document.getElementById("out").textContent = "Analyse en cours...";
  fetch(BACKEND + "/analyze", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({prompt: text})})
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var raw = d.result || d;
      document.getElementById("out").textContent = typeof raw === "string" ? raw.slice(0, 4000) : JSON.stringify(raw, null, 2).slice(0, 4000);
    })
    .catch(function(e) { document.getElementById("out").textContent = String(e.message || e); });
});
load();
</script>
</body>
</html>
