<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPERCOACH</title>
<style>
:root {
  --bg: #0a0f14;
  --card: #11171f;
  --accent: #22c55e;
  --gold: #eab308;
  --text: #e6edf3;
  --text2: #94a3b8;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  padding-bottom: 90px;
}

/* HEADER */
.hdr {
  position: sticky; top:0; z-index:100;
  background: rgba(10,15,20,0.95);
  backdrop-filter: blur(12px);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(234,179,8,0.2);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 2px;
}

.bolt {
  width: 42px;
  height: 52px;
  background: linear-gradient(160deg, #fde68a, #facc15, #ca8a04);
  clip-path: polygon(65% 0%, 35% 45%, 60% 45%, 35% 100%, 75% 50%, 48% 50%);
  filter: drop-shadow(0 0 12px rgba(234,179,8,0.6));
}

.hdr-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.live-pill {
  background: #ef4444;
  color: white;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: bold;
}

.lang-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(234,179,8,0.3);
  color: white;
  padding: 6px 12px;
  border-radius: 30px;
  font-size: 14px;
  cursor: pointer;
}

/* HERO */
.hero {
  text-align: center;
  padding: 30px 20px 20px;
}

.hero h1 {
  font-size: 42px;
  font-weight: 900;
  background: linear-gradient(90deg, #eab308, #22c55e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}

.sub {
  color: var(--text2);
  font-size: 18px;
}

/* SPORT FILTER */
.sport-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0 16px;
  margin: 20px 0;
}

.sport-chip {
  background: var(--card);
  border: 2px solid transparent;
  border-radius: 16px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s;
}

.sport-chip.active {
  border-color: var(--gold);
  background: rgba(234,179,8,0.15);
}

/* TABS */
.tabs {
  display: flex;
  gap: 12px;
  padding: 0 16px;
  margin: 10px 0;
}

.tab {
  flex: 1;
  padding: 14px;
  text-align: center;
  background: var(--card);
  border-radius: 16px;
  font-weight: 600;
  cursor: pointer;
}

.tab.active {
  background: var(--accent);
  color: black;
}

/* ANALYZE BUTTON */
.analyze-btn {
  margin: 30px 16px 20px;
  padding: 18px;
  background: linear-gradient(90deg, #22c55e, #16a34a);
  color: black;
  font-size: 18px;
  font-weight: 800;
  border-radius: 20px;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(34,197,94,0.3);
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(10,15,20,0.98);
  display: flex;
  justify-content: space-around;
  padding: 12px 0;
  border-top: 1px solid rgba(234,179,8,0.2);
}

.nav-item {
  text-align: center;
  color: var(--text2);
  cursor: pointer;
}

.nav-item.active { color: var(--gold); }
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">
    <div class="bolt"></div>
    <span>SUPERCOACH</span>
  </div>
  <div class="hdr-right">
    <div class="live-pill">● LIVE</div>
    <div class="lang-btn" onclick="toggleLang()">🇫🇷 FR ▼</div>
    <button onclick="openROI()">📊 ROI</button>
  </div>
</div>

<div class="hero">
  <h1>SUPERCOACH</h1>
  <p class="sub">⚡ Ton copilote IA sportif</p>
</div>

<h2 style="padding:0 16px; margin:20px 0 10px;">⚡ MATCHS À ANALYSER</h2>

<div class="sport-grid">
  <!-- Les chips seront générés par JS -->
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab(0)">📋 LISTE</div>
  <div class="tab" onclick="switchTab(1)">🌐 PAGE WEB</div>
</div>

<div style="padding:20px;">
  <textarea id="input" rows="8" style="width:100%; background:#1f2937; border:none; border-radius:16px; padding:16px; color:white;" placeholder="Colle tes matchs ici..."></textarea>
</div>

<button class="analyze-btn" onclick="analyze()">⚡ ANALYSER LES MATCHS</button>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <div class="nav-item active">⚡ Analyser</div>
  <div class="nav-item" onclick="openROI()">📊 ROI</div>
  <div class="nav-item">⚙️ Réglages</div>
</div>

<script>
// Ajoute ici ton ancien JS (toggleSport, analyze, etc.)
// Pour l'instant on teste la structure
function toggleLang() {
  alert("Sélecteur de langue à venir (EN, FR, ES, PT, AR)");
}
function openROI() {
  alert("Modal ROI - à rebrancher");
}
function switchTab(n) {
  alert("Onglet " + (n===0 ? "LISTE" : "PAGE WEB") + " sélectionné");
}
function analyze() {
  alert("Analyse lancée !");
}
</script>
</body>
</html>
